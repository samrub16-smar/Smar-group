<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3460"/>
      <stop offset="60%" stop-color="#0B1E3A"/>
      <stop offset="100%" stop-color="#081428"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D898" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#B58A3C" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a4068"/>
      <stop offset="100%" stop-color="#0B1E3A"/>
    </linearGradient>
    <pattern id="grain" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="transparent"/>
      <circle cx="20" cy="40" r="0.5" fill="#fff" opacity="0.06"/>
      <circle cx="80" cy="120" r="0.5" fill="#fff" opacity="0.05"/>
      <circle cx="150" cy="30" r="0.5" fill="#fff" opacity="0.07"/>
      <circle cx="170" cy="170" r="0.5" fill="#fff" opacity="0.05"/>
      <circle cx="50" cy="180" r="0.5" fill="#fff" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Sky / atmosphere -->
  <rect width="800" height="1000" fill="url(#sky)"/>

  <!-- Building silhouette - elegant hotel facade -->
  <g opacity="0.95">
    <!-- Main building -->
    <rect x="100" y="180" width="600" height="700" fill="#0B1E3A" stroke="#B58A3C" stroke-width="1" opacity="0.92"/>

    <!-- Top cornice -->
    <rect x="80" y="170" width="640" height="14" fill="#142949"/>
    <rect x="90" y="160" width="620" height="10" fill="#1d3661"/>

    <!-- Window grid - warm glowing -->
    <g>
      <!-- Row 1 -->
      <rect x="140" y="220" width="60" height="90" fill="url(#window)" opacity="0.85"/>
      <rect x="240" y="220" width="60" height="90" fill="url(#window)" opacity="0.75"/>
      <rect x="340" y="220" width="60" height="90" fill="url(#window)" opacity="0.88"/>
      <rect x="440" y="220" width="60" height="90" fill="url(#window)" opacity="0.7"/>
      <rect x="540" y="220" width="60" height="90" fill="url(#window)" opacity="0.9"/>
      <rect x="640" y="220" width="40" height="90" fill="url(#window)" opacity="0.78"/>

      <!-- Row 2 -->
      <rect x="140" y="340" width="60" height="90" fill="url(#window)" opacity="0.6"/>
      <rect x="240" y="340" width="60" height="90" fill="url(#window)" opacity="0.85"/>
      <rect x="340" y="340" width="60" height="90" fill="url(#window)" opacity="0.7"/>
      <rect x="440" y="340" width="60" height="90" fill="url(#window)" opacity="0.92"/>
      <rect x="540" y="340" width="60" height="90" fill="url(#window)" opacity="0.65"/>
      <rect x="640" y="340" width="40" height="90" fill="url(#window)" opacity="0.85"/>

      <!-- Row 3 -->
      <rect x="140" y="460" width="60" height="90" fill="url(#window)" opacity="0.78"/>
      <rect x="240" y="460" width="60" height="90" fill="url(#window)" opacity="0.6"/>
      <rect x="340" y="460" width="60" height="90" fill="url(#window)" opacity="0.88"/>
      <rect x="440" y="460" width="60" height="90" fill="url(#window)" opacity="0.7"/>
      <rect x="540" y="460" width="60" height="90" fill="url(#window)" opacity="0.82"/>
      <rect x="640" y="460" width="40" height="90" fill="url(#window)" opacity="0.92"/>

      <!-- Row 4 -->
      <rect x="140" y="580" width="60" height="90" fill="url(#window)" opacity="0.92"/>
      <rect x="240" y="580" width="60" height="90" fill="url(#window)" opacity="0.7"/>
      <rect x="340" y="580" width="60" height="90" fill="url(#window)" opacity="0.85"/>
      <rect x="440" y="580" width="60" height="90" fill="url(#window)" opacity="0.6"/>
      <rect x="540" y="580" width="60" height="90" fill="url(#window)" opacity="0.78"/>
      <rect x="640" y="580" width="40" height="90" fill="url(#window)" opacity="0.65"/>
    </g>

    <!-- Vertical dividers (columns) -->
    <line x1="220" y1="200" x2="220" y2="680" stroke="#142949" stroke-width="2"/>
    <line x1="320" y1="200" x2="320" y2="680" stroke="#142949" stroke-width="2"/>
    <line x1="420" y1="200" x2="420" y2="680" stroke="#142949" stroke-width="2"/>
    <line x1="520" y1="200" x2="520" y2="680" stroke="#142949" stroke-width="2"/>
    <line x1="620" y1="200" x2="620" y2="680" stroke="#142949" stroke-width="2"/>

    <!-- Grand entrance -->
    <rect x="340" y="700" width="120" height="180" fill="#1d3661"/>
    <rect x="350" y="710" width="100" height="170" fill="url(#window)" opacity="0.85"/>
    <!-- Entrance light overhead -->
    <circle cx="400" cy="690" r="6" fill="#F4D898" opacity="0.95"/>
    <ellipse cx="400" cy="700" rx="60" ry="20" fill="#F4D898" opacity="0.18"/>

    <!-- Lower ornamental band -->
    <rect x="100" y="690" width="240" height="6" fill="#B58A3C" opacity="0.5"/>
    <rect x="460" y="690" width="240" height="6" fill="#B58A3C" opacity="0.5"/>
  </g>

  <!-- Foreground - paved approach -->
  <path d="M0 880 L800 880 L800 1000 L0 1000 Z" fill="url(#floor)"/>
  <line x1="0" y1="900" x2="800" y2="900" stroke="#B58A3C" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="930" x2="800" y2="930" stroke="#B58A3C" stroke-width="1" opacity="0.2"/>

  <!-- Decorative trees on either side -->
  <g opacity="0.6">
    <circle cx="60" cy="800" r="55" fill="#142949"/>
    <circle cx="60" cy="770" r="40" fill="#1d3661"/>
    <rect x="55" y="820" width="10" height="60" fill="#0B1E3A"/>

    <circle cx="740" cy="800" r="55" fill="#142949"/>
    <circle cx="740" cy="770" r="40" fill="#1d3661"/>
    <rect x="735" y="820" width="10" height="60" fill="#0B1E3A"/>
  </g>

  <!-- Grain overlay -->
  <rect width="800" height="1000" fill="url(#grain)"/>

  <!-- Subtle vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="75%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
  </radialGradient>
  <rect width="800" height="1000" fill="url(#vig)"/>
</svg>
