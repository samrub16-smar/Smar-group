<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sea-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D898"/>
      <stop offset="40%" stop-color="#E8B97A"/>
      <stop offset="100%" stop-color="#B58A3C"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5278"/>
      <stop offset="100%" stop-color="#0B1E3A"/>
    </linearGradient>
    <linearGradient id="manor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F1"/>
      <stop offset="100%" stop-color="#E6DFD2"/>
    </linearGradient>
  </defs>

  <!-- Sunset sky -->
  <rect width="800" height="640" fill="url(#sea-sky)"/>

  <!-- Sun -->
  <circle cx="600" cy="220" r="50" fill="#FAF7F1" opacity="0.8"/>
  <circle cx="600" cy="220" r="80" fill="#FAF7F1" opacity="0.2"/>

  <!-- Distant coastline -->
  <path d="M0 380 Q200 360 400 370 T800 365 L800 410 L0 410 Z" fill="#1d3661" opacity="0.6"/>

  <!-- Sea -->
  <rect x="0" y="400" width="800" height="100" fill="url(#sea)"/>
  <!-- Wave lines -->
  <line x1="0" y1="430" x2="800" y2="430" stroke="#F4D898" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="450" x2="700" y2="450" stroke="#F4D898" stroke-width="1" opacity="0.2"/>
  <line x1="50" y1="470" x2="750" y2="470" stroke="#F4D898" stroke-width="1" opacity="0.25"/>

  <!-- Beach / promenade -->
  <rect x="0" y="500" width="800" height="140" fill="#0B1E3A"/>
  <rect x="0" y="500" width="800" height="20" fill="#B58A3C" opacity="0.3"/>

  <!-- Regency Manor Hotel - centred -->
  <g>
    <!-- Main body -->
    <rect x="220" y="280" width="360" height="220" fill="url(#manor)" stroke="#B58A3C" stroke-width="1.5"/>
    <!-- Roof -->
    <polygon points="210,280 400,200 590,280" fill="#0B1E3A"/>
    <polygon points="210,280 400,210 590,280" fill="#142949"/>
    <!-- Chimneys -->
    <rect x="270" y="220" width="18" height="50" fill="#0B1E3A"/>
    <rect x="512" y="220" width="18" height="50" fill="#0B1E3A"/>

    <!-- Pediment / classical detail -->
    <polygon points="350,260 400,235 450,260" fill="#FAF7F1" stroke="#B58A3C" stroke-width="1"/>

    <!-- Window grid -->
    <g>
      <!-- Upper -->
      <rect x="240" y="310" width="28" height="40" fill="#0B1E3A" stroke="#B58A3C" stroke-width="0.5"/>
      <rect x="290" y="310" width="28" height="40" fill="#0B1E3A" stroke="#B58A3C" stroke-width="0.5"/>
      <rect x="340" y="310" width="28" height="40" fill="#F4D898" stroke="#B58A3C" stroke-width="0.5" opacity="0.85"/>
      <rect x="390" y="310" width="28" height="40" fill="#0B1E3A" stroke="#B58A3C" stroke-width="0.5"/>
      <rect x="440" y="310" width="28" height="40" fill="#F4D898" stroke="#B58A3C" stroke-width="0.5" opacity="0.7"/>
      <rect x="490" y="310" width="28" height="40" fill="#0B1E3A" stroke="#B58A3C" stroke-width="0.5"/>
      <rect x="540" y="310" width="28" height="40" fill="#F4D898" stroke="#B58A3C" stroke-width="0.5" opacity="0.85"/>

      <!-- Lower -->
      <rect x="240" y="380" width="28" height="50" fill="#F4D898" stroke="#B58A3C" stroke-width="0.5" opacity="0.85"/>
      <rect x="290" y="380" width="28" height="50" fill="#F4D898" stroke="#B58A3C" stroke-width="0.5" opacity="0.7"/>
      <!-- Door -->
      <rect x="380" y="380" width="40" height="80" fill="#0B1E3A"/>
      <rect x="385" y="385" width="30" height="65" fill="#B58A3C" opacity="0.4"/>
      <circle cx="412" cy="425" r="2" fill="#B58A3C"/>

      <rect x="440" y="380" width="28" height="50" fill="#F4D898" stroke="#B58A3C" stroke-width="0.5" opacity="0.85"/>
      <rect x="490" y="380" width="28" height="50" fill="#F4D898" stroke="#B58A3C" stroke-width="0.5" opacity="0.7"/>
      <rect x="540" y="380" width="28" height="50" fill="#F4D898" stroke="#B58A3C" stroke-width="0.5" opacity="0.85"/>
    </g>

    <!-- Pillars at entrance -->
    <rect x="370" y="430" width="6" height="30" fill="#B58A3C"/>
    <rect x="424" y="430" width="6" height="30" fill="#B58A3C"/>
    <rect x="365" y="425" width="70" height="6" fill="#0B1E3A"/>

    <!-- Steps -->
    <rect x="350" y="460" width="100" height="6" fill="#FAF7F1"/>
    <rect x="355" y="466" width="90" height="6" fill="#E6DFD2"/>
    <rect x="360" y="472" width="80" height="6" fill="#FAF7F1"/>

    <!-- Cornice details -->
    <rect x="220" y="295" width="360" height="4" fill="#B58A3C" opacity="0.6"/>
    <rect x="220" y="365" width="360" height="2" fill="#B58A3C" opacity="0.4"/>
  </g>

  <!-- Decorative trees -->
  <g>
    <ellipse cx="120" cy="450" rx="50" ry="40" fill="#0B1E3A" opacity="0.7"/>
    <ellipse cx="120" cy="430" rx="35" ry="35" fill="#142949" opacity="0.8"/>

    <ellipse cx="680" cy="450" rx="50" ry="40" fill="#0B1E3A" opacity="0.7"/>
    <ellipse cx="680" cy="430" rx="35" ry="35" fill="#142949" opacity="0.8"/>
  </g>

  <!-- Birds -->
  <g opacity="0.6">
    <path d="M150 180 Q160 170 170 180 M170 180 Q180 170 190 180" stroke="#0B1E3A" stroke-width="1.5" fill="none"/>
    <path d="M250 150 Q258 142 266 150 M266 150 Q274 142 282 150" stroke="#0B1E3A" stroke-width="1.5" fill="none"/>
  </g>
</svg>
