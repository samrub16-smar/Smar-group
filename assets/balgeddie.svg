<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9bb8"/>
      <stop offset="50%" stop-color="#c8b78a"/>
      <stop offset="100%" stop-color="#e0c890"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5a3e"/>
      <stop offset="100%" stop-color="#2a3e2d"/>
    </linearGradient>
    <linearGradient id="harled" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0e6d2"/>
      <stop offset="100%" stop-color="#c4b89a"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="640" fill="url(#dawn)"/>

  <!-- Distant treeline -->
  <path d="M0 380 Q150 350 280 360 Q420 370 580 355 Q700 350 800 360 L800 410 L0 410 Z" fill="#2a3e2d" opacity="0.5"/>
  <path d="M0 400 Q120 385 260 390 Q400 395 540 385 Q680 380 800 388 L800 430 L0 430 Z" fill="#1f2e22" opacity="0.7"/>

  <!-- Lawn / croquet -->
  <rect x="0" y="420" width="800" height="220" fill="url(#lawn)"/>

  <!-- Hotel - 1920s listed building style -->
  <g>
    <!-- Main central body -->
    <rect x="240" y="270" width="320" height="220" fill="url(#harled)" stroke="#8a7a5a" stroke-width="1.5"/>

    <!-- Roof - distinctive 1920s pitched -->
    <polygon points="220,270 400,180 580,270" fill="#3a2820"/>
    <polygon points="220,270 400,190 580,270" fill="#4a3328"/>

    <!-- Half-timbering style gable detail -->
    <polygon points="370,265 400,235 430,265" fill="#f0e6d2"/>
    <line x1="385" y1="250" x2="400" y2="235" stroke="#3a2820" stroke-width="1.5"/>
    <line x1="415" y1="250" x2="400" y2="235" stroke="#3a2820" stroke-width="1.5"/>

    <!-- Chimneys -->
    <rect x="280" y="195" width="18" height="55" fill="#5a3d2a"/>
    <rect x="296" y="190" width="6" height="6" fill="#3a2820"/>
    <rect x="502" y="195" width="18" height="55" fill="#5a3d2a"/>
    <rect x="518" y="190" width="6" height="6" fill="#3a2820"/>

    <!-- Side wings (lower) -->
    <rect x="160" y="350" width="80" height="140" fill="url(#harled)" stroke="#8a7a5a" stroke-width="1"/>
    <polygon points="150,350 200,310 250,350" fill="#3a2820"/>

    <rect x="560" y="350" width="80" height="140" fill="url(#harled)" stroke="#8a7a5a" stroke-width="1"/>
    <polygon points="550,350 600,310 650,350" fill="#3a2820"/>

    <!-- Bay window centre -->
    <rect x="370" y="380" width="60" height="80" fill="#5a3d2a"/>
    <rect x="376" y="386" width="48" height="68" fill="#F4D898" opacity="0.85"/>
    <line x1="386" y1="386" x2="386" y2="454" stroke="#5a3d2a" stroke-width="1"/>
    <line x1="400" y1="386" x2="400" y2="454" stroke="#5a3d2a" stroke-width="1"/>
    <line x1="414" y1="386" x2="414" y2="454" stroke="#5a3d2a" stroke-width="1"/>

    <!-- Bay window roof -->
    <polygon points="365,380 400,360 435,380" fill="#3a2820"/>

    <!-- Main building windows -->
    <g>
      <!-- Upper floor -->
      <rect x="260" y="295" width="26" height="36" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.85"/>
      <rect x="298" y="295" width="26" height="36" fill="#0B1E3A" stroke="#5a3d2a" stroke-width="0.8"/>
      <rect x="336" y="295" width="26" height="36" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.75"/>
      <rect x="442" y="295" width="26" height="36" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.7"/>
      <rect x="480" y="295" width="26" height="36" fill="#0B1E3A" stroke="#5a3d2a" stroke-width="0.8"/>
      <rect x="518" y="295" width="26" height="36" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.85"/>

      <!-- Ground -->
      <rect x="260" y="380" width="30" height="60" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.85"/>
      <rect x="305" y="380" width="30" height="60" fill="#0B1E3A" stroke="#5a3d2a" stroke-width="0.8"/>
      <rect x="350" y="380" width="20" height="60" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.7"/>

      <rect x="430" y="380" width="20" height="60" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.7"/>
      <rect x="465" y="380" width="30" height="60" fill="#0B1E3A" stroke="#5a3d2a" stroke-width="0.8"/>
      <rect x="510" y="380" width="30" height="60" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.85"/>
    </g>

    <!-- Side wing windows -->
    <g>
      <rect x="175" y="370" width="22" height="32" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.85"/>
      <rect x="205" y="370" width="22" height="32" fill="#0B1E3A" stroke="#5a3d2a" stroke-width="0.8"/>
      <rect x="175" y="420" width="22" height="40" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.7"/>
      <rect x="205" y="420" width="22" height="40" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.85"/>

      <rect x="573" y="370" width="22" height="32" fill="#0B1E3A" stroke="#5a3d2a" stroke-width="0.8"/>
      <rect x="603" y="370" width="22" height="32" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.85"/>
      <rect x="573" y="420" width="22" height="40" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.85"/>
      <rect x="603" y="420" width="22" height="40" fill="#F4D898" stroke="#5a3d2a" stroke-width="0.8" opacity="0.7"/>
    </g>

    <!-- Stone band detail -->
    <rect x="240" y="365" width="320" height="3" fill="#8a7a5a" opacity="0.5"/>
  </g>

  <!-- Patio - cocktail tables -->
  <g>
    <ellipse cx="700" cy="510" rx="35" ry="10" fill="#FAF7F1" opacity="0.7"/>
    <circle cx="700" cy="490" r="14" fill="#FAF7F1" opacity="0.85"/>
    <rect x="698" y="495" width="4" height="15" fill="#FAF7F1" opacity="0.7"/>

    <ellipse cx="100" cy="510" rx="32" ry="10" fill="#FAF7F1" opacity="0.7"/>
    <circle cx="100" cy="492" r="12" fill="#FAF7F1" opacity="0.85"/>
  </g>

  <!-- Garden trees flanking -->
  <g>
    <ellipse cx="50" cy="420" rx="45" ry="55" fill="#1f2e22" opacity="0.85"/>
    <ellipse cx="50" cy="400" rx="35" ry="42" fill="#2a3e2d" opacity="0.9"/>

    <ellipse cx="750" cy="425" rx="48" ry="58" fill="#1f2e22" opacity="0.85"/>
    <ellipse cx="750" cy="405" rx="38" ry="45" fill="#2a3e2d" opacity="0.9"/>
  </g>

  <!-- Path -->
  <path d="M390 460 L410 460 L440 640 L360 640 Z" fill="#c4b89a" opacity="0.6"/>
</svg>
